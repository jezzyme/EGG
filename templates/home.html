<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGG | 맞춤형 모의면접</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            font-family: 'Gowun Dodum', sans-serif;
            background: radial-gradient(circle at 85% 7%, #fff1b9 0, #fff8d9 14%, transparent 33%), 
                        linear-gradient(135deg, #fbfaf5 0%, #f6f6ed 52%, #edf4e6 100%);
            color: #202a25;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 30px 6vw 55px;
        }
        
        .eg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 42px;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: 'Jua', sans-serif;
            font-size: 24px;
        }
        
        .egg-mark {
            width: 22px;
            height: 29px;
            display: inline-block;
            border-radius: 53% 47% 50% 50% / 45% 43% 57% 55%;
            background: #f7c63e;
            position: relative;
        }
        
        .egg-mark:after {
            content: '';
            position: absolute;
            width: 7px;
            height: 8px;
            top: 4px;
            left: 6px;
            border-radius: 50%;
            background: #fff2bb;
        }
        
        .motto {
            background: #e7eddf;
            color: #6a756a;
            border-radius: 22px;
            padding: 9px 16px;
            font-size: 12px;
        }
        
        .hero-title {
            font-family: 'Jua', sans-serif;
            font-size: clamp(38px, 5vw, 65px);
            line-height: 1.12;
            margin: 0 0 18px;
        }
        
        .hero-title span {
            color: #df941d;
        }
        
        .lead {
            font-size: 16px;
            line-height: 1.8;
            color: #667169;
            max-width: 445px;
        }
        
        .step-row {
            display: flex;
            gap: 10px;
            margin: 27px 0 0;
            flex-wrap: wrap;
        }
        
        .step {
            background: #fff;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 13px;
            box-shadow: 0 4px 16px #75807713;
        }
        
        .step strong {
            color: #d98f13;
            margin-left: 8px;
        }
        
        button {
            border-radius: 11px;
            border: 0;
            background: #263c31;
            color: white;
            min-height: 44px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 20px;
            font-family: 'Gowun Dodum', sans-serif;
            width: 100%;
            margin-top: 20px;
        }
        
        button:hover {
            background: #d98f13;
        }
        
        .footer-note {
            color: #8a9289;
            font-size: 11px;
            margin-top: 55px;
        }
        
        h1, h2, h3 {
            font-family: 'Jua', sans-serif;
            color: #202a25;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="eg-header">
            <div class="brand">
                <div class="egg-mark"></div> 
                EGG 
                <div style="font-family: Gowun Dodum; font-size:11px; color:#778078; line-height:1.1;">
                    Interview<br>Lab
                </div>
            </div>
            <div class="motto">나의 가능성을 한 단계 더 익히는 시간</div>
        </div>
        
        <div style="display: flex; gap: 40px; align-items: center;">
            <div style="flex: 1;">
                <div style="color:#d58b16; font-weight:700; font-size:14px; margin-bottom:10px;">AI 맞춤형 모의면접 앱</div>
                <div class="hero-title">
                    합격의 감각을<br>
                    <span>차근차근 익히는</span><br>
                    면접 연습
                </div>
                <div class="lead">
                    나의 스펙과 자기소개서를 바탕으로 질문을 만들고,<br>
                    답변의 밀도와 방향을 분석해 다음 연습을 제안해요.
                </div>
                <div class="step-row">
                    <div class="step">정보를 담고 <strong>→</strong></div>
                    <div class="step">답변을 익히고 <strong>→</strong></div>
                    <div class="step">합격에 가까워져요</div>
                </div>
                <a href="{{ url_for('profile_page') }}" style="text-decoration: none;">
                    <button>내 면접 재료 담으러 가기  →</button>
                </a>
            </div>
            
            <div style="flex: 1; text-align: center;">
                <div style="font-size: 12px; color: #8a9289;">
                    실제 배포 시 스크린샷이 표시됩니다
                </div>
            </div>
        </div>
        
        <div class="footer-note">
            <b>EGG</b>는 정보를 수집하는 것에서 끝나지 않고, <b>답변 → 피드백 → 재연습</b>의 루틴을 만듭니다.
        </div>
    </div>
</body>
</html>
