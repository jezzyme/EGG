<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 면접 재료 담기 | EGG</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            font-family: 'Gowun Dodum', sans-serif;
            background: radial-gradient(circle at 85% 7%, #fff1b9 0, #fff8d9 14%, transparent 33%), 
                        linear-gradient(135deg, #fbfaf5 0%, #f6f6ed 52%, #edf4e6 100%);
            color: #202a25;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 30px 6vw 55px;
        }
        
        .eg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 42px;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: 'Jua', sans-serif;
            font-size: 24px;
            cursor: pointer;
        }
        
        .egg-mark {
            width: 22px;
            height: 29px;
            display: inline-block;
            border-radius: 53% 47% 50% 50% / 45% 43% 57% 55%;
            background: #f7c63e;
            position: relative;
        }
        
        .egg-mark:after {
            content: '';
            position: absolute;
            width: 7px;
            height: 8px;
            top: 4px;
            left: 6px;
            border-radius: 50%;
            background: #fff2bb;
        }
        
        .motto {
            background: #e7eddf;
            color: #6a756a;
            border-radius: 22px;
            padding: 9px 16px;
            font-size: 12px;
        }
        
        h2 {
            font-family: 'Jua', sans-serif;
            color: #202a25;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .caption {
            color: #8a9289;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4c6351;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e3e8de;
            border-radius: 8px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.68);
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #d98f13;
            box-shadow: 0 0 0 3px rgba(217, 143, 19, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        button {
            border-radius: 11px;
            border: 0;
            background: #263c31;
            color: white;
            min-height: 44px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 20px;
            font-family: 'Gowun Dodum', sans-serif;
            width: 100%;
            margin-top: 20px;
        }
        
        button:hover {
            background: #d98f13;
        }
        
        button.back {
            background: #758077;
            margin-top: 10px;
        }
        
        button.back:hover {
            background: #5a6361;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .button-group button {
            flex: 1;
            margin-top: 0;
        }
        
        .button-group .back {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('home') }}" style="text-decoration: none;">
            <div class="eg-header">
                <div class="brand">
                    <div class="egg-mark"></div> 
                    EGG 
                    <div style="font-family: Gowun Dodum; font-size:11px; color:#778078; line-height:1.1;">
                        Interview<br>Lab
                    </div>
                </div>
                <div class="motto">나의 가능성을 한 단계 더 익히는 시간</div>
            </div>
        </a>
        
        <h2>나의 면접 재료 담기</h2>
        <div class="caption">입력한 정보는 나에게 맞는 질문과 피드백을 만드는 데 사용돼요.</div>
        
        <form method="POST">
            <div class="cols">
                <div class="form-group">
                    <label>학과 / 전공</label>
                    <input type="text" name="department" placeholder="예: 경영학과">
                </div>
                <div class="form-group">
                    <label>관심 기업</label>
                    <input type="text" name="company" placeholder="예: 카카오">
                </div>
            </div>
            
            <div class="cols">
                <div class="form-group">
                    <label>관심 직무</label>
                    <input type="text" name="role" placeholder="예: 서비스 기획">
                </div>
                <div class="form-group">
                    <label>자격증</label>
                    <input type="text" name="certificates" placeholder="예: ADsP, SQLD">
                </div>
            </div>
            
            <div class="cols">
                <div class="form-group">
                    <label>어학 성적</label>
                    <input type="text" name="language" placeholder="예: TOEIC 890">
                </div>
                <div class="form-group">
                    <label>인턴 · 대외활동 · 수상</label>
                    <input type="text" name="activities" placeholder="예: 앱 공모전 대상">
                </div>
            </div>
            
            <div class="form-group">
                <label>자기소개서 또는 강조하고 싶은 경험</label>
                <textarea name="cover_letter" placeholder="가장 자신 있는 경험을 자유롭게 적어주세요."></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" style="flex: 2;">면접 재료 저장하고 질문 받기  →</button>
                <a href="{{ url_for('home') }}" style="flex: 1; text-decoration: none;">
                    <button class="back" type="button">← 돌아가기</button>
                </a>
            </div>
        </form>
    </div>
</body>
</html>
